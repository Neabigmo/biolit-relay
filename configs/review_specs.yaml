  # -------------------------------------------------------------------------
  # Leenaars_2020 - methotrexate in rheumatoid arthritis (patients / animal models)
  # -------------------------------------------------------------------------
  - id: "Leenaars_2020"
    nominal_records: 7216
    nominal_included: 583
    topic: "Efficacy of methotrexate in rheumatoid arthritis patients or RA animal models"
    source_reference: "https://doi.org/10.3390/ani10061047"
    rule_version: "v1.0.0"
    eligibility_text: "We included all studies in which MTX was administered to RA patients or RA animal models in our ongoing review. We excluded studies on other diseases than RA, studies that were not in vivo, studies that did not administer MTX (or only had treatment groups co-administering MTX with other experimental drugs), studies that did not analyse efficacy (e.g., safety studies), and publications that did not contain new data (e.g., reviews and editorials)."
    criteria:
      - id: "disease"
        name: "Rheumatoid arthritis"
        required: true
        automation_level: "MEDIUM"
        support_cues:
          - "rheumatoid arthritis"
          - "rheumatoid"
          - "ra patient"
          - "ra patients"
          - "ra model"
          - "ra models"
          - "ra rat"
          - "ra rats"
          - "ra mouse"
          - "ra mice"
          - "collagen-induced arthritis"
          - "collagen induced arthritis"
          - "adjuvant-induced arthritis"
          - "adjuvant induced arthritis"
          - "pristane-induced arthritis"
          - "pristane induced arthritis"
        contradict_cues:
          - "osteoarthritis"
          - "psoriatic arthritis"
          - "ankylosing spondylitis"
          - "healthy volunteers"
          - "healthy subjects"
        notes: >-
          Documented deviation from the draft: bare "RA" is not used as a cue
          because in biomedical abstracts it also abbreviates retinoic acid, right
