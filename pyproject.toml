[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolit-relay"
version = "1.0.0"
description = "Criterion-aware risk routing for budgeted biomedical systematic-review screening"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
asreview = ["asreview>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
